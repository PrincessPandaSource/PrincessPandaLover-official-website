<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It's raining men</title>
  <style>
    #gameScreen {
      background-image: url("cloudy-sky.jpg");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <p style="text-align: center">HALLELUJAH!</p>
  <canvas id="gameScreen" width="400" height="450"></canvas>
  
  <script>
    const canvas = document.getElementById("gameScreen");
    const ctx = canvas.getContext("2d");
    
    let gameStarted = false;
    let gameOver = false;
    let leftPressed = false;
    let rightPressed = false;
    let tellEverybody = false;
    let score = 0;
    
    let amy = {
      x: 145,
      y: 290,
      width: 456,
      height: 672,
      speed: 5,
      image: new Image()
    };
    amy.image.src = 'amy.webp';
    amy.width = amy.width / 5;
    amy.height = amy.height / 5;
    amy.x = (canvas.width - amy.width) / 2;
    
    let theMen = {
      x: [],
      y: [],
      width: [],
      height: [],
      sourceUrls: [
        "sonic.webp",
        "shadow.webp",
        "silver.webp"
      ],
      sourceWidths: [1782, 597, 602],
      sourceHeights: [2784, 965, 1012],
      scaleDown: [20, 6, 6],
      speed: 2,
      state: [],
      images: []
    }
    
    let eggmen = {
      x: [],
      y: [],
      width: 1270,
      height: 1748,
      speed: 2,
      state: [],
      image: new Image(),
    }
    eggmen.width = eggmen.width / 8;
    eggmen.height = eggmen.height / 8;
    eggmen.image.src = "eggman.webp";
    
    const gameOverScreen = new Image();
    gameOverScreen.src = "game-over.jpg";
    
    const rainingMenAudio = new Audio("its-raining-men.mp3");
    const music = new Audio("mario-kart-wii-win.mp3");
    music.loop = true;
    const imTheMan = new Audio("im-the-man.mp3");
    const howCouldThisHappenToMe = new Audio("how.mp3");
    
    document.addEventListener("keydown", keyDownHandler, false);
    document.addEventListener("keyup", keyUpHandler, false);
    
    function keyDownHandler(e) {
      if (e.key === "Left" || e.key === "ArrowLeft") {
        leftPressed = true;
        if (!gameStarted) {
          startGame();
          gameStarted = true;
        }
      } else if (e.key === "Right" || e.key === "ArrowRight") {
        rightPressed = true;
        if (!gameStarted) {
          startGame();
          gameStarted = true;
        }
      }
    }
    
    function keyUpHandler(e) {
      if (e.key === "Left" || e.key === "ArrowLeft") {
        leftPressed = false;
      } else if (e.key === "Right" || e.key === "ArrowRight") {
        rightPressed = false;
      }
    }
    
    function checkCollision(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
             rect1.x + rect1.width > rect2.x &&
             rect1.y < rect2.y + rect2.height &&
             rect1.y + rect1.height > rect2.y;
    }
    
    function drawAmy() {
      ctx.drawImage(amy.image, amy.x, amy.y, amy.width, amy.height);
    }
    
    function addNewMen() {
      if (Math.random() < 0.01) {
        let charID = Math.floor(Math.random() * 3);
        let newImage = new Image();
        newImage.src = theMen.sourceUrls[charID];
        theMen.x.push(Math.random() * canvas.width);
        theMen.y.push(-theMen.sourceHeights[charID] / theMen.scaleDown[charID]);
        theMen.width.push(theMen.sourceWidths[charID] / theMen.scaleDown[charID]);
        theMen.height.push(theMen.sourceHeights[charID] / theMen.scaleDown[charID]);
        theMen.state.push(true);
        theMen.images.push(newImage);
      }
    }
    
    function addEggmen() {
      if (Math.random() < 0.003) {
        eggmen.x.push(Math.random() * canvas.width);
        eggmen.y.push(-eggmen.height);
        eggmen.state.push(true);
      }
    }
    
    function drawTheMen() {
      for (let i = 0; i < theMen.x.length; i++) {
        if (theMen.state[i] && theMen.images[i].complete) {
          ctx.drawImage(theMen.images[i], theMen.x[i], theMen.y[i], theMen.width[i], theMen.height[i]);
        }
      }
    }
    
    function drawEggmen() {
      for (let i = 0; i < eggmen.x.length; i++) {
        if (eggmen.state[i] && eggmen.image.complete) {
          ctx.drawImage(eggmen.image, eggmen.x[i], eggmen.y[i], eggmen.width, eggmen.height);
        }
      }
    }
    
    function drawGrass() {
      ctx.beginPath();
      ctx.rect(0, 400, canvas.width, 50);
      ctx.fillStyle = "#008000";
      ctx.fill();
      ctx.closePath();
    }
    
    function drawScore() {
      ctx.font = "75px Arial";
      ctx.fillStyle = "#F0FFFF";
      ctx.fillText(`${score}`, canvas.width / 2 - 25, 75);
    }
    
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrass();
      drawAmy();
      drawTheMen();
      drawEggmen();
      addNewMen();
      addEggmen();
      drawScore();
      
      if (leftPressed && amy.x > (0 - (amy.width / 2))) {
        amy.x -= amy.speed;
      }
      if (rightPressed && amy.x < canvas.width - (amy.width / 2)) {
        amy.x += amy.speed;
      }
      
      for (let i = 0; i < theMen.x.length; i++) {
        theMen.y[i] += theMen.speed;
        if (theMen.y[i] > amy.y) {
          theMen.state[i] = false;
        }
        if (checkCollision(amy, {x: theMen.x[i], y: theMen.y[i], width: theMen.width[i], height: theMen.height[i]})) {
          if (theMen.state[i]) {
            score++;
            if ((score % 50 == 0) && !tellEverybody) {
              lotsaMen();
            }
          }
          theMen.state[i] = false;
        }
      }
      
      for (let i = 0; i < eggmen.x.length; i++) {
        eggmen.y[i] += eggmen.speed;
        if (eggmen.y[i] > amy.y) {
          eggmen.state[i] = false;
        }
        if ((checkCollision(amy, {x: eggmen.x[i], y: eggmen.y[i], width: eggmen.width, height: eggmen.height}))
          && eggmen.state[i]) {
          gameOver = true;
          stopTheMusic();
          ctx.drawImage(gameOverScreen, 0, 0, canvas.width, canvas.height);
          return;
        }
      }
      
      if (!gameOver) {
        requestAnimationFrame(draw);
      }
    }
    
    function startingAudio() {
      rainingMenAudio.play();
      setTimeout(playMusic, rainingMenAudio.duration * 1000);
    }
    
    function playMusic() {
      if (!gameOver && !tellEverybody) {
        music.play();
      }
    }
    
    function lotsaMen() {
      tellEverybody = true;
      music.pause();
      imTheMan.play();
      imTheMan.onended = function() {
        tellEverybody = false;
        if (!gameOver) {
          music.play();
        }
      };
    }
    
    function stopTheMusic() {
      if (rainingMenAudio) {
        rainingMenAudio.pause();
      }
      if (music) {
        music.pause();
      }
      if (imTheMan) {
        imTheMan.pause();
      }
      howCouldThisHappenToMe.play();
    }
    
    function startGame() {
      startingAudio();
      draw();
    }
    
    drawGrass();
    drawAmy();
  </script>
</body>
</html>
